<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@400;700&family=Poppins:wght@400;600;900&family=Archivo+Black&family=Lisu+Bosa:ital,wght@0,400;0,900;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shop-detail.css">
    <link rel="stylesheet" href="navbar.css">
    <script src="shop-detail.js" defer></script>
    <script src="navbar.js"></script>
    <title>Document</title>
</head>
<body>
<!-- notif -->
    <div id="toast-container" class="notification-container"></div>
    <!-- NAVIGATION BAR -->
    <nav class="navbar">
    <div class="logo">
        <img src="sources/pinxel_logo.png" alt="Pinxel Boutique" style="height: 80px;">
    </div>
    
    <div class="nav-right-group">
        <div class="nav-links-container">
            <span onclick="location.href='index.html'">Home</span>
            <span onclick="location.href='index.html#about-section'">About</span>
            <span onclick="location.href='shop.html'">Shop</span>
        </div>

        <div id="auth-section"></div>
    </div>
</nav>


<!-- PRODUCTS -->
<div class="main-product-layout">
    <div class="detail-image-container">
        <img id="main-product-img" src="" alt="Product Image">
    </div>

        <div class="detail-info">
           <div class="product-header-row">
                <h1 id="product-name" class="product-name">PRODUCT NAME</h1>
                <img src="sources/heart.png" class="heart-icon-img" alt="Add to favorites">
            </div>

            <p id="product-price" class="price-tag">P0.00</p>
            <p class="tax-note">All taxes and duties are included</p>

            <div class="selection-row color-line">
                <span class="label">Color:</span>
                <div class="color-display">
                    <div id="product-color-box" class="color-rect"></div>
                    <span id="product-color-name">Pink</span>
                </div>
            </div>

            <div class="selection-group">
                <p class="label">Select Size:</p>
                <div id="size-options-container" class="size-options">
                </div>
            </div>

            <button class="btn-add-cart" id = "btn-add-cart">ADD TO SHOPPING BAG</button>
        </div>
    </div>

    <section class="recommendations">
        <h2 class="section-title">YOU MAY ALSO LIKE</h2>
        <div class="recommendations-wrapper">
            <button class="scroll-btn left">❮</button>
            <div id="recommendations-grid" class="products-grid">
                </div>
            <button class="scroll-btn right">❯</button>
        </div>
    </section>
</main>

<footer class="footer-links-container">
        <div class="footer-col">
            <img src="sources/pinxel_logo.png" class="footer-small-logo" alt="Pinxel Boutique">
            <p class="copy-small">All rights reserved ©2026</p>
        </div>

        <div class="footer-col">
            <p>National University</p>
            <p>Coral Way St.</p>
            <p>Pasay, Philippines</p>
        </div>

        <div class="footer-col">
            <a href="#">Privacy Policy</a>
        </div>

        <div class="footer-col">
            <a href="https://www.facebook.com/anamariarachel.medalla/" target="_blank">Facebook</a>
            <a href="https://www.instagram.com/anaaxcyur_/" target="_blank">Instagram</a>
            <a href="https://www.linkedin.com/in/ana-maria-rachel-medalla-19b883306/" target="_blank">LinkedIn</a>
            <a href="https://x.com/shuasanaity" target="_blank">Twitter (X)</a>
        </div>

        <div class="footer-col">
            <a href="#">Work</a>
            <a href="#">Services</a>
            <a href="#">About</a>
            <a href="#">Careers</a>
        </div>
    </footer>
</body>
</html>
